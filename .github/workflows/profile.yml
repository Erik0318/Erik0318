name: Refresh profile

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - profile.config.json
      - README.md
      - .github/workflows/profile.yml
  pull_request:
    paths:
      - scripts/**
      - profile.config.json
      - .github/workflows/profile.yml

permissions:
  contents: read

concurrency:
  group: profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - run: node --test scripts/*.test.mjs
      - run: node scripts/profile.mjs --check

  refresh:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - name: Fetch GitHub data and render profile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/profile.mjs --refresh
          node scripts/snake.mjs
      - run: node scripts/profile.mjs --check
      - run: node --test scripts/graphics.test.mjs
      - name: Commit only changed generated files
        run: |
          git add README.md data/profile.json docs/activity.md assets/stats-*.svg assets/snake-*.svg assets/project-*.svg assets/profile-divider.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh profile statistics'
          git push origin HEAD:main
