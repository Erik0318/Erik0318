<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Erik's project constellation</title>
  <desc id="desc">An animated map connecting five projects to their languages and platforms.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050914"/>
      <stop offset="0.5" stop-color="#071522"/>
      <stop offset="1" stop-color="#0E0920"/>
    </linearGradient>
    <linearGradient id="flow" x1="110" y1="0" x2="1090" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67F5D2"/>
      <stop offset="0.52" stop-color="#62D9FF"/>
      <stop offset="1" stop-color="#9B6CFF"/>
    </linearGradient>
    <radialGradient id="core">
      <stop stop-color="#62D9FF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#62D9FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" stroke="#D3EEF5" stroke-opacity="0.035"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="298" rx="20"/></clipPath>
  </defs>

  <rect x="1" y="1" width="1198" height="298" rx="20" fill="url(#bg)" stroke="#6AA7BE" stroke-opacity="0.24" stroke-width="2"/>
  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#grid)"/>
    <circle cx="600" cy="150" r="150" fill="url(#core)"/>

    <g stroke="#294556" stroke-width="1.5" fill="none">
      <path id="p1" d="M525 127C440 82 390 65 310 65"/>
      <path id="p2" d="M525 173C440 218 390 235 310 235"/>
      <path id="p3" d="M675 116C760 67 810 55 890 55"/>
      <path id="p4" d="M680 150H890"/>
      <path id="p5" d="M675 184C760 233 810 245 890 245"/>
    </g>

    <g stroke="url(#flow)" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="12 28" opacity="0.78">
      <use href="#p1"><animate attributeName="stroke-dashoffset" values="80;0" dur="3.2s" repeatCount="indefinite"/></use>
      <use href="#p2"><animate attributeName="stroke-dashoffset" values="80;0" dur="3.7s" repeatCount="indefinite"/></use>
      <use href="#p3"><animate attributeName="stroke-dashoffset" values="0;-80" dur="3.4s" repeatCount="indefinite"/></use>
      <use href="#p4"><animate attributeName="stroke-dashoffset" values="0;-80" dur="2.8s" repeatCount="indefinite"/></use>
      <use href="#p5"><animate attributeName="stroke-dashoffset" values="0;-80" dur="3.9s" repeatCount="indefinite"/></use>
    </g>

    <g transform="translate(600 150)">
      <circle r="75" stroke="#67F5D2" stroke-opacity="0.16" stroke-dasharray="4 8">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
      </circle>
      <circle r="53" stroke="#9B6CFF" stroke-opacity="0.27" stroke-dasharray="2 7">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="12s" repeatCount="indefinite"/>
      </circle>
      <circle r="38" fill="#081725" stroke="url(#flow)" stroke-width="2"/>
      <path d="M-14 8L0-15L14 8M-8 2H8" stroke="#67F5D2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="75" cy="0" r="4" fill="#67F5D2" filter="url(#glow)">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="36" y="38" fill="#7894A5" font-size="11" letter-spacing="2">PROJECT CONSTELLATION // LIVE SIGNAL</text>
      <g transform="translate(76 39)">
        <rect width="234" height="52" rx="11" fill="#071522" fill-opacity="0.88" stroke="#67F5D2" stroke-opacity="0.34"/>
        <circle cx="20" cy="26" r="5" fill="#67F5D2" filter="url(#glow)"/>
        <text x="38" y="23" fill="#E5F3F7" font-size="14" font-weight="700">SUTURE</text>
        <text x="38" y="39" fill="#718E9F" font-size="9" letter-spacing="1.5">RUST / NATIVE MEDIA</text>
      </g>

      <g transform="translate(76 209)">
        <rect width="234" height="52" rx="11" fill="#071522" fill-opacity="0.88" stroke="#62D9FF" stroke-opacity="0.32"/>
        <circle cx="20" cy="26" r="5" fill="#62D9FF" filter="url(#glow)"/>
        <text x="38" y="23" fill="#E5F3F7" font-size="14" font-weight="700">LETTERBOXD AI</text>
        <text x="38" y="39" fill="#718E9F" font-size="9" letter-spacing="1.5">TYPESCRIPT / LOCAL WEB</text>
      </g>

      <g transform="translate(890 29)">
        <rect width="234" height="52" rx="11" fill="#071522" fill-opacity="0.88" stroke="#9B6CFF" stroke-opacity="0.4"/>
        <circle cx="214" cy="26" r="5" fill="#9B6CFF" filter="url(#glow)"/>
        <text x="18" y="23" fill="#E5F3F7" font-size="14" font-weight="700">TANG25K CPU</text>
        <text x="18" y="39" fill="#718E9F" font-size="9" letter-spacing="1.5">VERILOG / FPGA</text>
      </g>

      <g transform="translate(890 124)">
        <rect width="234" height="52" rx="11" fill="#071522" fill-opacity="0.88" stroke="#FFB454" stroke-opacity="0.36"/>
        <circle cx="214" cy="26" r="5" fill="#FFB454" filter="url(#glow)"/>
        <text x="18" y="23" fill="#E5F3F7" font-size="14" font-weight="700">TEMPOPILOT</text>
        <text x="18" y="39" fill="#718E9F" font-size="9" letter-spacing="1.5">JAVASCRIPT / EXTENSION</text>
      </g>

      <g transform="translate(890 219)">
        <rect width="234" height="52" rx="11" fill="#071522" fill-opacity="0.88" stroke="#62D9FF" stroke-opacity="0.32"/>
        <circle cx="214" cy="26" r="5" fill="#62D9FF" filter="url(#glow)"/>
        <text x="18" y="23" fill="#E5F3F7" font-size="14" font-weight="700">TWIGOO</text>
        <text x="18" y="39" fill="#718E9F" font-size="9" letter-spacing="1.5">COMMAND UI / FORUM</text>
      </g>

      <text x="600" y="277" text-anchor="middle" fill="#607D8D" font-size="10" letter-spacing="2">FOLLOW THE ABSTRACTION UNTIL IT BECOMES REAL</text>
    </g>
  </g>
</svg>
