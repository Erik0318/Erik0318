<svg width="1200" height="430" viewBox="0 0 1200 430" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Erik — software, AI, and hardware builder</title>
  <desc id="desc">An animated terminal-inspired banner with shifting colors, orbiting particles, and rotating project descriptions.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050B14"/>
      <stop offset="0.55" stop-color="#071827"/>
      <stop offset="1" stop-color="#0D0A20"/>
    </linearGradient>
    <linearGradient id="accent" x1="180" y1="80" x2="980" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#65F6D1">
        <animate attributeName="stop-color" values="#65F6D1;#6EE7FF;#65F6D1" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#6EE7FF">
        <animate attributeName="stop-color" values="#6EE7FF;#8B5CF6;#6EE7FF" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#8B5CF6">
        <animate attributeName="stop-color" values="#8B5CF6;#65F6D1;#8B5CF6" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glowMint">
      <stop stop-color="#65F6D1" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#65F6D1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple">
      <stop stop-color="#8B5CF6" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#B9D7E8" stroke-opacity="0.055"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="panelClip">
      <rect x="50" y="35" width="1100" height="360" rx="24"/>
    </clipPath>
  </defs>

  <rect width="1200" height="430" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="430" rx="30" fill="url(#grid)"/>

  <g clip-path="url(#panelClip)">
    <circle cx="160" cy="80" r="250" fill="url(#glowMint)">
      <animate attributeName="cx" values="160;380;160" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="80;170;80" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1040" cy="350" r="290" fill="url(#glowPurple)">
      <animate attributeName="cx" values="1040;820;1040" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="350;245;350" dur="11s" repeatCount="indefinite"/>
    </circle>

    <g opacity="0.65">
      <circle cx="1000" cy="95" r="3" fill="#65F6D1" filter="url(#softGlow)">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1050" cy="135" r="2" fill="#6EE7FF">
        <animate attributeName="opacity" values="1;0.15;1" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="945" cy="155" r="2.5" fill="#8B5CF6">
        <animate attributeName="opacity" values="0.15;1;0.15" dur="3.8s" repeatCount="indefinite"/>
      </circle>
      <path d="M945 155L1000 95L1050 135" stroke="url(#accent)" stroke-opacity="0.35"/>
    </g>

    <rect x="50" y="35" width="1100" height="360" rx="24" fill="#07111F" fill-opacity="0.5" stroke="url(#accent)" stroke-opacity="0.58" stroke-width="1.5"/>
    <path d="M50 87H1150" stroke="#CDEBFA" stroke-opacity="0.12"/>

    <circle cx="82" cy="61" r="6" fill="#FF6B6B"/>
    <circle cx="104" cy="61" r="6" fill="#F7C948"/>
    <circle cx="126" cy="61" r="6" fill="#65F6D1"/>
    <text x="600" y="67" text-anchor="middle" fill="#9BB4C5" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="2">ERIK.DEV / PROFILE</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="105" y="138" fill="#65F6D1" font-size="17">erik@dev:~$</text>
      <text x="245" y="138" fill="#D8ECF7" font-size="17">./introduce --mode=builder</text>

      <text x="103" y="230" fill="url(#accent)" font-size="76" font-weight="800" letter-spacing="10">ERIK</text>
      <rect x="105" y="247" width="445" height="3" rx="1.5" fill="url(#accent)">
        <animate attributeName="width" values="0;445;445" keyTimes="0;0.35;1" dur="2.5s" repeatCount="indefinite"/>
      </rect>

      <text x="109" y="285" fill="#91A9BA" font-size="15" letter-spacing="4">SOFTWARE  /  AI  /  HARDWARE</text>

      <g font-size="19">
        <text x="108" y="334" fill="#65F6D1">›</text>
        <g>
          <text x="138" y="334" fill="#E8F5FB">building local-first AI tools</text>
          <animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;0.27;0.32;0.61;0.66;0.95;1" dur="9s" repeatCount="indefinite"/>
        </g>
        <g opacity="0">
          <text x="138" y="334" fill="#E8F5FB">crafting tiny browser utilities</text>
          <animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;0.27;0.32;0.61;0.66;0.95;1" dur="9s" repeatCount="indefinite"/>
        </g>
        <g opacity="0">
          <text x="138" y="334" fill="#E8F5FB">wiring 16-bit FPGA computers</text>
          <animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;0.27;0.32;0.61;0.66;0.95;1" dur="9s" repeatCount="indefinite"/>
        </g>
        <rect x="500" y="316" width="10" height="22" fill="#65F6D1">
          <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.45;0.5;1" dur="1s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <g transform="translate(886 232)">
      <circle r="86" stroke="#65F6D1" stroke-opacity="0.18" stroke-dasharray="5 9">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="22s" repeatCount="indefinite"/>
      </circle>
      <circle r="57" stroke="#8B5CF6" stroke-opacity="0.24" stroke-dasharray="2 8">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="14s" repeatCount="indefinite"/>
      </circle>
      <circle r="22" fill="#091826" stroke="url(#accent)" stroke-width="2"/>
      <path d="M-8 0L-2 6L9-8" stroke="#65F6D1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="86" cy="0" r="5" fill="#65F6D1" filter="url(#softGlow)">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-57" cy="0" r="4" fill="#8B5CF6">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="4s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="122" text-anchor="middle" fill="#91A9BA" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="2">STATUS: SHIPPING</text>
    </g>

    <rect x="0" y="0" width="1200" height="2" fill="url(#accent)" opacity="0.32">
      <animate attributeName="y" values="0;430" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.35;0" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
