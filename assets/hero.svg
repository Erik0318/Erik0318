<svg width="1200" height="240" viewBox="0 0 1200 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Erik — systems and product builder</title>
  <desc id="desc">An animated developer console showing Erik's focus across software, media, and hardware.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050914"/>
      <stop offset="0.56" stop-color="#071522"/>
      <stop offset="1" stop-color="#100A25"/>
    </linearGradient>
    <linearGradient id="accent" x1="70" y1="40" x2="1130" y2="210" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67F5D2"/>
      <stop offset="0.5" stop-color="#62D9FF"/>
      <stop offset="1" stop-color="#9B6CFF"/>
    </linearGradient>
    <linearGradient id="mutedLine" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#67F5D2" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#67F5D2" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9B6CFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="mintGlow">
      <stop stop-color="#67F5D2" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#67F5D2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow">
      <stop stop-color="#9B6CFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#9B6CFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="#C7E8F3" stroke-opacity="0.045"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame">
      <rect x="1" y="1" width="1198" height="238" rx="20"/>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="1198" height="238" rx="20" fill="url(#bg)" stroke="url(#accent)" stroke-opacity="0.52" stroke-width="2"/>
  <g clip-path="url(#frame)">
    <rect width="1200" height="240" fill="url(#grid)"/>
    <circle cx="180" cy="65" r="235" fill="url(#mintGlow)">
      <animate attributeName="cx" values="180;320;180" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="215" r="260" fill="url(#violetGlow)">
      <animate attributeName="cx" values="1080;920;1080" dur="14s" repeatCount="indefinite"/>
    </circle>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="54" y="44" fill="#67F5D2" font-size="14">erik@workbench:~$</text>
      <text x="224" y="44" fill="#B5C9D6" font-size="14">boot --mode=build</text>
      <rect x="386" y="31" width="8" height="17" fill="#67F5D2">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.45;0.5;1" dur="1s" repeatCount="indefinite"/>
      </rect>

      <text x="51" y="128" fill="url(#accent)" font-size="76" font-weight="800" letter-spacing="12">ERIK</text>
      <text x="55" y="161" fill="#DCEBF3" font-size="17" letter-spacing="3">SYSTEMS × PRODUCTS × STRANGE IDEAS</text>
      <text x="55" y="199" fill="#849EAF" font-size="13">low-level CS/EE · privacy-minded software · films &amp; sound</text>

      <g transform="translate(735 25)">
        <rect width="420" height="188" rx="14" fill="#07111F" fill-opacity="0.72" stroke="#B4DCEB" stroke-opacity="0.15"/>
        <path d="M0 39H420" stroke="#B4DCEB" stroke-opacity="0.11"/>
        <circle cx="19" cy="19" r="4" fill="#FF6B6B"/>
        <circle cx="34" cy="19" r="4" fill="#FFB454"/>
        <circle cx="49" cy="19" r="4" fill="#67F5D2"/>
        <text x="397" y="24" text-anchor="end" fill="#6F899B" font-size="10" letter-spacing="2">CURRENT BUILD</text>

        <text x="24" y="79" fill="#F4F9FC" font-size="25" font-weight="700" letter-spacing="4">SUTURE</text>
        <text x="24" y="104" fill="#8DA7B7" font-size="12">STITCH AUDIO. KEEP IT LOCAL.</text>

        <g font-size="10" letter-spacing="1">
          <rect x="24" y="124" width="58" height="24" rx="12" fill="#67F5D2" fill-opacity="0.1" stroke="#67F5D2" stroke-opacity="0.4"/>
          <text x="53" y="140" text-anchor="middle" fill="#67F5D2">RUST</text>
          <rect x="90" y="124" width="62" height="24" rx="12" fill="#62D9FF" fill-opacity="0.09" stroke="#62D9FF" stroke-opacity="0.35"/>
          <text x="121" y="140" text-anchor="middle" fill="#62D9FF">EGUI</text>
          <rect x="160" y="124" width="74" height="24" rx="12" fill="#9B6CFF" fill-opacity="0.1" stroke="#9B6CFF" stroke-opacity="0.4"/>
          <text x="197" y="140" text-anchor="middle" fill="#B697FF">FFMPEG</text>
        </g>

        <circle cx="29" cy="169" r="4" fill="#67F5D2" filter="url(#glow)">
          <animate attributeName="opacity" values="0.35;1;0.35" dur="1.8s" repeatCount="indefinite"/>
        </circle>
        <text x="43" y="173" fill="#8DA7B7" font-size="10" letter-spacing="1.5">STATUS: SHIPPING</text>
        <path d="M278 168H390" stroke="#20394A" stroke-width="4" stroke-linecap="round"/>
        <path d="M278 168H366" stroke="url(#accent)" stroke-width="4" stroke-linecap="round">
          <animate attributeName="stroke-dasharray" values="0 112;88 24;88 24" keyTimes="0;0.75;1" dur="3s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>

    <rect x="0" y="0" width="1200" height="2" fill="url(#mutedLine)">
      <animate attributeName="y" values="0;240" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="5.5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
