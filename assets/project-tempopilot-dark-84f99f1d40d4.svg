<svg xmlns="http://www.w3.org/2000/svg" width="440" height="252" viewBox="0 0 440 252" role="img" aria-labelledby="title desc">
<title id="title">TempoPilot</title><desc id="desc">Keyboard-driven video speed control with rebindable shortcuts and automatic video selection. Animated diagram is illustrative, not live application data.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.caption{font-family:Consolas,Menlo,monospace;font-size:9px;letter-spacing:.6px;fill:#919aa5}.faint{opacity:.8}
.playhead{animation:seek 9s linear infinite}.trace{animation:trace 8s linear infinite}
.stage{opacity:.12;animation:stage 8s linear infinite}.stage-1{animation-delay:2s}.stage-2{animation-delay:4s}.stage-3{animation-delay:6s}
.film{animation:film 8s ease-in-out infinite}.film-1{animation-delay:.15s}.film-2{animation-delay:.3s}
.insight{transform-box:fill-box;transform-origin:center bottom;animation:insight 8s ease-in-out infinite}
.speed-0{stroke-dashoffset:35;animation:progress-normal 10s linear infinite}.speed-1{stroke-dashoffset:0;animation:progress-fast 10s linear infinite}
.cursor-0{transform:translateX(227.5px);animation:normal-cursor 10s linear infinite}.cursor-1{transform:translateX(350px);animation:fast-cursor 10s linear infinite}
@keyframes seek{0%,8%{transform:translateX(0)}90%,100%{transform:translateX(378px)}}
@keyframes trace{to{stroke-dashoffset:-96}}
@keyframes stage{0%,22%{opacity:1}25%,97%{opacity:.12}100%{opacity:1}}
@keyframes film{0%,25%,100%{transform:translateY(0)}45%,75%{transform:translateY(-4px)}}
@keyframes insight{0%,20%,100%{transform:scaleY(.7)}45%,80%{transform:scaleY(1)}}
@keyframes progress-normal{0%,10%{stroke-dashoffset:100}90%,100%{stroke-dashoffset:0}}
@keyframes progress-fast{0%,10%{stroke-dashoffset:100}50%,100%{stroke-dashoffset:0}}
@keyframes normal-cursor{0%,10%{transform:translateX(0)}90%,100%{transform:translateX(350px)}}
@keyframes fast-cursor{0%,10%{transform:translateX(0)}50%,100%{transform:translateX(350px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.playhead{transform:translateX(160px)}.stage{opacity:.35}}
</style>
<rect x=".5" y=".5" width="439" height="251" rx="10" fill="#0d1117" stroke="#30363d"/>
<text x="24" y="35" font-size="21" font-weight="600" fill="#e6edf3">TempoPilot</text>
<text x="24" y="60" font-size="13" fill="#919aa5">Control video speed from the keyboard.</text>
<text x="24" y="79" font-size="13" fill="#919aa5">Rebind shortcuts. Keep your own pace.</text>
<path d="M413 20h8v8M412 29l9-9" fill="none" stroke="#919aa5" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(24 98)"><text x="0" y="12" class="caption">PLAYBACK SPEED</text><text x="392" y="12" class="caption faint" text-anchor="end">COMPARISON</text><text x="0" y="44" font-size="13" fill="#e6edf3">1×</text><path d="M42 40H392" stroke="#30363d" stroke-width="3" stroke-linecap="round"/><path class="speed-0" d="M42 40H392" pathLength="100" stroke="#9bc5b5" stroke-width="3" stroke-linecap="round" stroke-dasharray="100"/><g transform="translate(42 40)"><circle class="cursor-0" r="4" fill="#e6edf3"/></g><text x="0" y="80" font-size="13" fill="#e6edf3">2×</text><path d="M42 76H392" stroke="#30363d" stroke-width="3" stroke-linecap="round"/><path class="speed-1" d="M42 76H392" pathLength="100" stroke="#9bc5b5" stroke-width="3" stroke-linecap="round" stroke-dasharray="100"/><g transform="translate(42 76)"><circle class="cursor-1" r="4" fill="#e6edf3"/></g><text x="42" y="102" class="caption">SAME CLIP · DIFFERENT PACE</text></g>
<path d="M24 218H416" stroke="#30363d"/>
<text x="24" y="239" font-size="11" fill="#919aa5">JavaScript · WebExtensions</text>
</svg>
