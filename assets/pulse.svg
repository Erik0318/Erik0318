<svg width="1200" height="72" viewBox="0 0 1200 72" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title">
  <title id="title">Animated circuit pulse</title>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#8B5CF6"/>
      <stop offset="0.5" stop-color="#65F6D1"/>
      <stop offset="0.8" stop-color="#6EE7FF"/>
      <stop offset="1" stop-color="#6EE7FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <path d="M0 36H350L372 36L388 12L414 60L438 25L454 36H1200" stroke="#20384A" stroke-width="2"/>
  <path d="M0 36H350L372 36L388 12L414 60L438 25L454 36H1200" stroke="url(#line)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="190 1010" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="1200;0;-1200" dur="5s" repeatCount="indefinite"/>
  </path>
  <circle cx="600" cy="36" r="3" fill="#65F6D1">
    <animate attributeName="r" values="2;5;2" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
